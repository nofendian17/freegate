# Single compose file for freegate. WARP egress is optional and controlled by
# EGRESS_MODE / WARP_* below; set EGRESS_MODE=warp in .env to enable it.

services:
  proxy:
    # Published by GoReleaser to GHCR on every tagged release.
    # To build from source instead: docker compose up -d --build
    image: ghcr.io/nofendian17/freegate:latest
    pull_policy: always
    build: .
    container_name: fg-proxy
    ports:
      - "127.0.0.1:1234:1234"
    # No dns: override on purpose. Pinning 1.1.1.1/1.0.0.1 here made every
    # upstream lookup fail ("lookup opencode.ai on 127.0.0.11:53: i/o
    # timeout") on hosts whose router blocks outbound UDP/53 from the docker
    # bridge. Docker's embedded resolver already forwards to the host
    # resolver, which works.
    environment:
      - PORT=1234
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - RATE_LIMIT=${RATE_LIMIT:-60}
      - MAX_REQUEST_BODY_MB=${MAX_REQUEST_BODY_MB:-30}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - UPSTREAM_URL_OPENCODE=${UPSTREAM_URL_OPENCODE:-https://opencode.ai/inference/v1}
      - UPSTREAM_OPENCODE_BUN_TLS=${UPSTREAM_OPENCODE_BUN_TLS:-true}
      - UPSTREAM_KEY_OPENCODE=${UPSTREAM_KEY_OPENCODE:-public}
      - UPSTREAM_OPENCODE_FREE_ALLOWLIST=${UPSTREAM_OPENCODE_FREE_ALLOWLIST:-big-pickle}
      - UPSTREAM_REFRESH_OPENCODE=${UPSTREAM_REFRESH_OPENCODE:-60}
      - UPSTREAM_URL_KILO=${UPSTREAM_URL_KILO:-https://api.kilo.ai/api/openrouter}
      - UPSTREAM_KEY_KILO=${UPSTREAM_KEY_KILO:-anonymous}
      - UPSTREAM_REFRESH_KILO=${UPSTREAM_REFRESH_KILO:-60}
      - UPSTREAM_URL_LLM7=${UPSTREAM_URL_LLM7:-https://api.llm7.io/v1}
      - UPSTREAM_REFRESH_LLM7=${UPSTREAM_REFRESH_LLM7:-300}
      # Was missing: UPSTREAM_DEFAULT is read by config.Load, so without this
      # line editing it in .env had no effect on the container.
      - UPSTREAM_DEFAULT=${UPSTREAM_DEFAULT:-opencode}
      # Direct config for Responses API models (comma-separated substrings, e.g. muse-spark)
      - RESPONSE_MODELS=${RESPONSE_MODELS:-muse-spark,muse_spark}
      # Direct config for Messages API models (comma-separated substrings, e.g. union-alpha via /inference/v1/messages)
      - MESSAGE_MODELS=${MESSAGE_MODELS:-union-alpha}
      # Debug: raw upstream response logging via slog (stdout). Default
      # false; lines contain full conversation content, enable only while
      # debugging.
      - UPSTREAM_CAPTURE=${UPSTREAM_CAPTURE:-false}
      # === Egress: in-process WARP (optional) ===
      # off = direct connections (default). Set EGRESS_MODE=warp to route
      # through WARP exits that run inside this container. No sidecars,
      # NET_ADMIN or /dev/net/tun are needed.
      - EGRESS_MODE=${EGRESS_MODE:-off}
      - WARP_STACK=${WARP_STACK:-dual}
      - WARP_POOL_SIZE=${WARP_POOL_SIZE:-2}
      # "auto" discovers a routed public IPv6 /64 from the host. Override it
      # with an explicit prefix when the host prefix is not visible in the
      # container. Without a usable prefix, warp mode fails closed.
      - WARP_SOURCE_IPV6=${WARP_SOURCE_IPV6:-auto}
      - WARP_REGISTRATION_TIMEOUT=${WARP_REGISTRATION_TIMEOUT:-5m}
      - WARP_ROTATE_WAIT=${WARP_ROTATE_WAIT:-30s}
      # When no WARP exit is available, fail closed by default. Set true only
      # when availability matters more than hiding the host address.
      - EGRESS_FALLBACK_DIRECT=${EGRESS_FALLBACK_DIRECT:-false}
      - PROVIDERS_DB_PATH=/data/providers.db
    volumes:
      - fg-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

volumes:
  fg-data:

networks:
  default:
    # The OpenCode client prefers IPv6 and falls back to IPv4 on its own, so
    # this is optional: without it the container is IPv4-only and every dial
    # uses the fallback. IPv6 is preferred when the host provides it.
    # Docker assigns a ULA /64 automatically; pinning a subnet here would
    # collide with other projects on the same host using the same range.
    enable_ipv6: true
