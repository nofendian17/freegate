version: 2

project_name: freegate

builds:
  - id: freegate
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: freegate
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - .env.example

# Multi-arch images published to GHCR on every tagged release:
#   ghcr.io/nofendian17/freegate:latest and :<version>
# dockers_v2 uses buildx to build one multi-arch manifest directly;
# Dockerfile.release copies the pre-built binary from the context
# ($TARGETPLATFORM/freegate) — no in-container compile.
dockers_v2:
  - id: freegate
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/nofendian17/freegate
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    # GH runners use the 'docker' buildx driver, which does not support
    # attestations; keep the default off instead of failing the release.
    sbom: false

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: nofendian17
    name: freegate
  footer: |
    ## Single binary (no Docker)

    freegate is a single binary per OS (linux/darwin/windows).

    ```bash
    ./freegate --port 1234
    ```

    ## Docker

    `docker-compose.yml` runs the same single binary containerized.
