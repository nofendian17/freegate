<div id="pg-overlay" x-data="playground()" x-show="open" x-cloak
     x-on:open-playground.window="open = true; $nextTick(() => { $refs.input.focus(); loadModels() })"
     class="fixed inset-0 z-50 flex justify-end bg-ink/40"
     role="dialog" aria-modal="true" aria-labelledby="pg-title"
     x-transition.opacity>
  <div id="pg-panel" class="flex h-full w-full max-w-xl flex-col border-l border-hairline bg-paper" @click.outside="close()" @keydown.escape.window="close()">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-hairline p-5">
      <span id="pg-title" class="text-body font-medium text-ink">Playground</span>
      <div class="flex flex-wrap items-center gap-2">
        <select id="pg-model" x-model="model" aria-label="Model" @change="save()"
          class="max-w-56 rounded-2xl border border-hairline bg-canvas px-3 py-2 text-caption text-ink outline-none">
          <option value="" disabled x-show="!models.length">Loading models…</option>
          <template x-for="m in models" :key="m">
            <option :value="m" x-text="m"></option>
          </template>
        </select>
        <label class="flex cursor-pointer items-center gap-1.5 text-caption text-mid-gray">
          <input id="pg-stream" type="checkbox" x-model="stream" @change="save()" class="size-4 accent-[#0a0a0a]"> stream
        </label>
        <button id="pg-clear" title="Clear thread" type="button" @click="clear()"
          class="rounded-2xl px-3 py-2 text-caption text-mid-gray transition-colors hover:bg-canvas hover:text-ink">Clear</button>
        <button id="pg-close" aria-label="Close playground" type="button" @click="close()"
          class="rounded-2xl px-3 py-2 text-caption text-mid-gray transition-colors hover:bg-canvas hover:text-ink">Close</button>
      </div>
    </header>
    <div id="pg-list" class="flex flex-1 flex-col gap-4 overflow-y-auto p-5" role="log" aria-live="polite">
      <div id="pg-empty" x-show="!messages.length" class="m-auto text-body text-mid-gray">Pick a model and say something.</div>
      <template x-for="(m, i) in messages" :key="i">
        <div class="rounded-2xl border border-hairline bg-paper p-4" :class="m.role === 'user' ? 'border-l-4 border-l-ink-soft' : (m.err ? 'border-l-4 border-l-ember' : 'border-l-4 border-l-ink')">
          <p class="mb-1.5 font-mono text-caption text-mid-gray" x-text="meta(m)"></p>
          <pre class="m-0 whitespace-pre-wrap break-words font-mono text-body text-ink" :class="m.err && 'text-ember'" x-text="m.content"></pre>
        </div>
      </template>
      <div x-show="streaming" class="rounded-2xl border border-hairline border-l-4 border-l-ink bg-paper p-4">
        <p class="mb-1.5 font-mono text-caption text-mid-gray">assistant</p>
        <pre class="m-0 whitespace-pre-wrap break-words font-mono text-body text-ink"><span x-text="draft"></span><span class="animate-pulse">▍</span></pre>
      </div>
    </div>
    <footer class="flex flex-col gap-3 border-t border-hairline bg-surface-alt p-5">
      <div>
        <button id="pg-system-toggle" type="button" @click="showSystem = !showSystem" :aria-expanded="showSystem"
          class="p-0 text-caption text-mid-gray hover:text-ink">System prompt</button>
        <textarea id="pg-system" x-show="showSystem" x-model="system" @input="save()" rows="2" placeholder="Optional system prompt…"
          class="mt-2 w-full resize-y rounded-2xl border border-hairline bg-canvas p-2.5 text-body text-ink outline-none placeholder:text-mid-gray"></textarea>
      </div>
      <form id="pg-form" @submit.prevent="send()" class="flex items-stretch gap-2">
        <textarea id="pg-input" x-ref="input" x-model="input" rows="3" @keydown.enter.exact.prevent="send()"
          placeholder="Type a message… (Enter to send, Shift+Enter for new line)"
          class="min-h-16 flex-1 resize-y rounded-2xl border border-hairline bg-canvas p-2.5 text-body text-ink outline-none placeholder:text-mid-gray"></textarea>
        <button id="pg-send" type="submit" :disabled="busy"
          class="self-end rounded-2xl bg-ink px-4 py-2 text-body font-medium text-surface-alt transition-opacity hover:opacity-90 disabled:opacity-40">Send</button>
        <button id="pg-stop" type="button" x-show="streaming" @click="stop()"
          class="self-end rounded-2xl border border-ember px-4 py-2 text-body font-medium text-ember transition-colors hover:bg-ember hover:text-paper">Stop</button>
      </form>
    </footer>
  </div>
</div>
