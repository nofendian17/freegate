# Optional WARP egress for the OpenCode upstream.
#
#   docker compose -f docker-compose.yml -f docker-compose.warp.yml up -d
#
# WARP exits run inside freegate: no sidecar containers, no NET_ADMIN, no TUN
# device. Each exit registers its own Cloudflare device and binds a random
# address from WARP_SOURCE_IPV6 (a routed /64) as its outer source. When the
# upstream answers a free-tier 429, freegate retires the exit that served the
# request and retries from a replacement with a fresh /64.
#
# The host must actually be able to use an address from WARP_SOURCE_IPV6 as a
# source. Without it, replacements share the host address and therefore the
# same free-tier quota. With Docker, route that prefix to the container (or
# run the proxy with host networking) — an unrouted prefix fails at bind time.

services:
  proxy:
    environment:
      - EGRESS_MODE=warp
      - WARP_STACK=${WARP_STACK:-ipv6}
      - WARP_POOL_SIZE=${WARP_POOL_SIZE:-2}
      - WARP_SOURCE_IPV6=${WARP_SOURCE_IPV6:?WARP_SOURCE_IPV6 must be a routed IPv6 /64}
      - WARP_REGISTRATION_TIMEOUT=${WARP_REGISTRATION_TIMEOUT:-5m}
      - WARP_ROTATE_WAIT=${WARP_ROTATE_WAIT:-30s}
      # A dead pool fails closed (host IP never leaks). Set true only when
      # availability matters more than the exit address.
      - EGRESS_FALLBACK_DIRECT=${EGRESS_FALLBACK_DIRECT:-false}
