version: 2

project_name: freegate

builds:
  - id: freegate
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: freegate
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - .env.example

# Multi-arch images published to GHCR on every tagged release:
#   ghcr.io/nofendian17/freegate:latest and :<version>
# dockers_v2 uses buildx to build one multi-arch manifest directly;
# Dockerfile.release copies the pre-built binary from the context
# ($TARGETPLATFORM/freegate) — no in-container compile.
dockers_v2:
  - id: freegate
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/nofendian17/freegate
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: nofendian17
    name: freegate
  footer: |
    ## Single binary (no Docker)

    freegate is now a single binary with embedded VPNGate per OS
    (linux/darwin/windows). No `vpn` sidecar is required. The binary
    auto-detects `runtime.GOOS` and probes for `openvpn` (`openvpn.exe` on
    Windows). If `openvpn` is missing or `tun` permission fails, it falls
    back to direct mode automatically.

    ```bash
    # single binary (embedded VPN, requires sudo/Admin for tun)
    sudo ./freegate --port 1234
    sudo ./freegate --vpn=false --port 1234   # direct, no VPN

    # env alternative
    VPN_ENABLED=false ./freegate
    VPN_PROVIDER=direct ./freegate
    ```

    ## Docker (legacy)

    `docker-compose.yml` (proxy + vpn sidecar) still works for containerized
    deployments. Set `VPNGATE_HOST=vpn` to keep the sidecar path.
