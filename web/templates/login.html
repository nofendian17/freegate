{{template "layout/head" .}}

<body>
  <main class="flex min-h-screen items-center justify-center bg-canvas px-6">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <p class="mb-2 text-caption uppercase tracking-[0.05em] text-mid-gray">TerminalUI</p>
        <h1 class="text-heading font-semibold text-ink">$ freegate</h1>
        <p class="mt-2 text-body text-mid-gray">// admin login — enter ADMIN_TOKEN</p>
      </div>
      <div class="rounded-3xl border border-hairline bg-paper p-5 shadow-card">
        <h2 class="mb-1 text-body font-medium text-ink">Login</h2>
        <p class="mb-5 text-caption text-mid-gray">Authenticate to access the dashboard.</p>
        {{if .Error}}<div role="alert" class="mb-4 rounded-2xl border border-ember bg-paper p-3 text-caption text-ember">{{.Error}}</div>{{end}}
        <form method="POST" action="/login{{if .Next}}?next={{.Next}}{{end}}">
          {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
          <label for="admin_token" class="mb-1.5 block text-caption uppercase tracking-[0.05em] text-mid-gray">Admin token</label>
          <input id="admin_token" name="admin_token" type="password" placeholder="••••••••" required autofocus autocomplete="current-password"
            class="mb-5 w-full rounded-2xl border border-hairline bg-canvas px-3 py-2.5 font-mono text-body text-ink outline-none placeholder:text-mid-gray focus:ring-1 focus:ring-hairline">
          <button type="submit" class="w-full rounded-2xl bg-ink px-4 py-2.5 text-body font-medium text-surface-alt transition-opacity hover:opacity-90">Login</button>
        </form>
      </div>
      <footer class="mt-8 text-center text-caption text-mid-gray">freegate</footer>
    </div>
  </main>
</body>
</html>
