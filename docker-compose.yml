services:
  proxy:
    # Published by GoReleaser to GHCR on every tagged release.
    # To build from source instead: docker compose up -d --build
    image: ghcr.io/nofendian17/freegate:latest
    pull_policy: always
    build: .
    container_name: fg-proxy
    ports:
      - "127.0.0.1:1234:1234"
    # OpenVPN needs to create a TUN/TAP device and manage routes.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - VPNGATE_COUNTRY=${VPNGATE_COUNTRY:-}
      - VPNGATE_MIN_SCORE=${VPNGATE_MIN_SCORE:-0}
      - VPNGATE_MAX_PING=${VPNGATE_MAX_PING:-0}
      - VPNGATE_REFRESH_SECONDS=${VPNGATE_REFRESH_SECONDS:-300}
      - PORT=1234
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT=${RATE_LIMIT:-60}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - UPSTREAM_URL_OPENCODE=${UPSTREAM_URL_OPENCODE:-https://opencode.ai/zen/v1}
      - UPSTREAM_KEY_OPENCODE=${UPSTREAM_KEY_OPENCODE:-public}
      - UPSTREAM_OPENCODE_FREE_ALLOWLIST=${UPSTREAM_OPENCODE_FREE_ALLOWLIST:-big-pickle}
      - UPSTREAM_REFRESH_OPENCODE=${UPSTREAM_REFRESH_OPENCODE:-60}
      - UPSTREAM_URL_KILO=${UPSTREAM_URL_KILO:-https://api.kilo.ai/api/openrouter}
      - UPSTREAM_KEY_KILO=${UPSTREAM_KEY_KILO:-anonymous}
      - UPSTREAM_REFRESH_KILO=${UPSTREAM_REFRESH_KILO:-60}
      - UPSTREAM_URL_LLM7=${UPSTREAM_URL_LLM7:-https://api.llm7.io/v1}
      - UPSTREAM_REFRESH_LLM7=${UPSTREAM_REFRESH_LLM7:-300}
      # Direct config for Responses API models (comma-separated substrings, e.g. muse-spark)
      - RESPONSE_MODELS=${RESPONSE_MODELS:-muse-spark,muse_spark}
      # Direct config for Messages API models (comma-separated substrings, e.g. union-alpha via /zen/v1/messages)
      - MESSAGE_MODELS=${MESSAGE_MODELS:-union-alpha}
      # Debug: raw upstream response logging via slog (stdout). Default
      # false; lines contain full conversation content, enable only while
      # debugging.
      - UPSTREAM_CAPTURE=${UPSTREAM_CAPTURE:-false}
      - PROVIDERS_DB_PATH=/data/providers.db
    volumes:
      - fg-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

volumes:
  fg-data:
