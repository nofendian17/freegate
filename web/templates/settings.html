{{template "layout/head" .}}

<body x-data>
  {{template "layout/nav" .}}

  <main class="mx-auto max-w-7xl px-6 pb-24 pt-12">
    <header class="mb-12">
      <p class="mb-2 text-caption uppercase tracking-[0.05em] text-mid-gray">Configuration</p>
      <h1 class="text-heading-lg font-semibold text-ink sm:text-display">$ settings</h1>
      <p class="mt-3 max-w-xl text-body text-mid-gray">// client access and server preferences</p>
    </header>

    <!-- Client API Keys -->
    <section class="mb-6 min-w-0 overflow-hidden rounded-3xl border border-hairline bg-paper shadow-card">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-hairline p-5">
        <div>
          <h2 class="text-body font-medium text-ink">Client API keys</h2>
          <p class="mt-1 text-caption text-mid-gray">Keys for /v1/* clients — reveal with Show, copy anytime</p>
        </div>
        <button id="key-new" type="button" class="rounded-2xl bg-ink px-4 py-2 text-body font-medium text-surface-alt transition-opacity hover:opacity-90">New key</button>
      </div>
      <div id="key-err" role="alert" class="mx-5 mt-4 hidden rounded-2xl border border-ember bg-paper p-3 text-caption text-ember"></div>
      <div id="key-created" class="mx-5 mt-4 hidden rounded-2xl border border-hairline bg-surface-alt p-3 font-mono text-caption text-ink"></div>
      <div class="overflow-auto">
        <table class="w-full text-left text-body">
          <thead>
            <tr class="border-b border-hairline text-caption uppercase tracking-[0.05em] text-mid-gray">
              <th class="px-5 py-3 font-medium">Name</th>
              <th class="px-5 py-3 font-medium">Prefix</th>
              <th class="w-24 px-5 py-3 font-medium">Uses</th>
              <th class="w-28 px-5 py-3 font-medium">Last used</th>
              <th class="w-24 px-5 py-3 font-medium">Enabled</th>
              <th class="w-56 px-5 py-3 font-medium">Actions</th>
            </tr>
          </thead>
          <tbody id="key-table">
            <tr><td colspan="6" class="px-5 py-8 text-center text-body text-mid-gray" aria-busy="true">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Key form -->
      <form id="key-form" class="hidden gap-5 border-t border-hairline p-5">
        <input type="hidden" id="kf-id">
        <label class="flex flex-col gap-1.5" for="kf-name">
          <span class="text-caption uppercase tracking-[0.05em] text-mid-gray">Key name</span>
          <input id="kf-name" required placeholder="my-client" class="rounded-2xl border border-hairline bg-canvas px-3 py-2.5 text-body text-ink outline-none placeholder:text-mid-gray">
        </label>
        <label class="flex items-center gap-2 text-body" for="kf-enabled">
          <input id="kf-enabled" type="checkbox" checked class="size-4 accent-[#0a0a0a]"> Enabled
        </label>
        <div class="flex flex-wrap gap-2">
          <button id="key-save" type="submit" class="rounded-2xl bg-ink px-4 py-2 text-body font-medium text-surface-alt transition-opacity hover:opacity-90">Save key</button>
          <button id="key-cancel" type="button" class="rounded-2xl px-4 py-2 text-body font-medium text-mid-gray transition-colors hover:bg-canvas">Cancel</button>
        </div>
      </form>
    </section>

    <footer class="mt-12 border-t border-hairline pt-6 text-center text-caption text-mid-gray">freegate — configuration</footer>
  </main>
  <span hidden data-api="/api/api-keys"></span>
</body>
</html>
